[project]
name = "recurrent-transformer-pytorch"
version = "0.0.4"
description = "Recurrent Transformer"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'transformers',
    'recurrence'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.4.0",
    "einops>=0.8.1",
    "torch>=2.5",
    "x-mlps-pytorch>=0.6.0"
]

[project.urls]
Homepage = "https://pypi.org/project/recurrent-transformer/"
Repository = "https://github.com/lucidrains/recurrent-transformer"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["recurrent_transformer"]

[tool.hatch.build.targets.sdist]
include = [
    "recurrent_transformer",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
